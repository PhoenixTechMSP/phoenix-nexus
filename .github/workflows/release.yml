# Publication d'une version : declenchee par un tag  vX.Y.Z  (ou vX.Y.Z-alpha.N).
# Verifie que le tag correspond a package.json, rejoue les tests serveur, publie l'image versionnee sur ghcr.io
# et cree la release GitHub avec les notes extraites de CHANGELOG.md. Voir RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: The tag must match package.json and have a CHANGELOG section
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "Tag $GITHUB_REF_NAME ne correspond pas a package.json ($PKG)"; exit 1; }
          awk -v v="$VERSION" '$0 ~ "^## "{p=(index($0,"## " v " ")==1 || $0=="## " v)} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "Aucune section '## $VERSION' dans CHANGELOG.md"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build

      - name: Server tests
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          printf '\n---\nImage: `%s:%s`\n\nUpgrading: see UPGRADING.md. A database backup is made automatically before any migration.\n' "$IMAGE" "${GITHUB_REF_NAME#v}" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Phoenix-Nexus ${GITHUB_REF_NAME#v}" --notes-file release-notes.md $FLAGS
