# Integration continue : chaque push et chaque pull request rejoue TOUTE la batterie de tests.
# Sur develop et main, une fois les tests verts : construction de l'image, puis deploiement (develop -> UAT, main -> PRODUCTION).
# Voir deploy/CICD.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      # Le client est construit AVANT les tests : le test de bout en bout du mode demo verifie aussi la page servie.
      - name: Build the client
        run: npm run build

      - name: Server tests (API, security, demo mode, startup, translations, repository guards)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Browser tests (CMDB, SAM, full UI crawl, business flows, demo mode)
        run: bash scripts/e2e/run.sh all

  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the image reference (tag = commit SHA, immutable)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-uat:
    needs: image
    # Tant que le serveur n'est pas pret, ne rien deployer : definir la variable de depot DEPLOY_ENABLED=true pour activer.
    if: github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: uat
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  deploy-prod:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
