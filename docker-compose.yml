services:
  nexus:
    build: .
    image: phoenix-nexus:2.0.0-alpha.1
    container_name: phoenix-nexus
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # ptx.db est le nom historique du fichier : il est conserve pour que les dossiers data/
      # existants continuent de fonctionner (un autre nom demarrerait sur une base vide).
      - DB_PATH=/data/ptx.db
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - generate one with openssl rand -hex 32}"
      - TZ=${TZ:-Europe/Brussels}
      # SSO - optional (see .env.example)
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - SSO_TENANT_ID=${SSO_TENANT_ID:-}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-}
      - SSO_ALLOWED_DOMAINS=${SSO_ALLOWED_DOMAINS:-}
      - SSO_DEFAULT_ROLE=${SSO_DEFAULT_ROLE:-pending}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
